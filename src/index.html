<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps CI/CD Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>DevOps CI/CD Demo</h1>
        <p>GitHub Actions + SonarQube + Docker + AWS</p>
    </header>
    <main>
        <section>
            <h2>Automated Pipeline</h2>
            <p>
                This application is deployed using an automated

            </p>

            <div class="pipeline">
                <span>GitHub</span>
                <span>→</span>
                <span>GitHub Actions</span>
                <span>→</span>
                <span>SonarQube</span>
                <span>→</span>
                <span>Docker</span>
                <span>→</span>
                <span>AWS</span>
            </div>
        </section>
    </main>

    <footer>
        <p>DevOps Portfolio Project</p>
    </footer>

</body>
</html>
